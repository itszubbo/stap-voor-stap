name: Deploy Stap voor Stap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Haal de bestanden op
        uses: actions/checkout@v4
      - name: Controleer JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
      - name: Stel GitHub Pages in
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Maak websitepakket
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
