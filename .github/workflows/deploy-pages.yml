name: Deploy Stap voor Stap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Haal de bestanden op
        uses: actions/checkout@v4
      - name: Stel Node.js in
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installeer app-pakketten
        run: npm install --no-audit --no-fund
      - name: Bouw websitebestanden
        run: |
          node --check app.js
          node --check service-worker.js
          node --check native-notifications-entry.mjs
          npm run build:web
      - name: Stel GitHub Pages in
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Maak websitepakket
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Publiceer website
        id: deployment
        uses: actions/deploy-pages@v4
